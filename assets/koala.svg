<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Cloud base -->
  <path d="M40 128 C30 128 22 120 22 110 C22 102 28 95 36 93 C37 80 48 70 61 70 C66 70 71 72 75 75 C81 67 91 62 101 62 C115 62 127 72 129 86 C137 88 142 95 142 103 C142 113 134 121 124 121 L40 121 Z" fill="#e0f2fe" opacity="0.9"/>
  <path d="M45 125 C36 125 30 119 30 111 C30 104 35 98 42 97 C43 86 52 77 63 77 C67 77 71 78 75 81 C80 74 88 70 97 70 C109 70 119 79 121 90 C128 92 133 98 133 105 C133 113 126 120 118 120 L45 120 Z" fill="#ffffff"/>

  <!-- Koala ears -->
  <circle cx="45" cy="56" r="18" fill="#94a3b8"/>
  <circle cx="45" cy="56" r="11" fill="#fbcfe8"/>

  <circle cx="115" cy="56" r="18" fill="#94a3b8"/>
  <circle cx="115" cy="56" r="11" fill="#fbcfe8"/>

  <!-- Koala head -->
  <circle cx="80" cy="68" r="30" fill="#94a3b8"/>

  <!-- Koala body hugging cloud -->
  <ellipse cx="80" cy="100" rx="26" ry="20" fill="#94a3b8"/>
  <ellipse cx="80" cy="102" rx="17" ry="13" fill="#f1f5f9"/>

