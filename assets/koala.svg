  <ellipse cx="60" cy="98" rx="9" ry="6" fill="#cbd5e1" transform="rotate(-15 60 98)"/>
  <ellipse cx="100" cy="98" rx="9" ry="6" fill="#cbd5e1" transform="rotate(15 100 98)"/>

