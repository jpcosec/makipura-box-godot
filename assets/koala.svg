  <path d="M86 66 Q93 73 100 66" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Soft pink cheeks -->
  <circle cx="56" cy="74" r="5" fill="#f472b6" opacity="0.6"/>
  <circle cx="104" cy="74" r="5" fill="#f472b6" opacity="0.6"/>

  <!-- Big iconic oval koala nose -->
  <ellipse cx="80" cy="72" rx="9" ry="13" fill="#334155"/>
  <ellipse cx="78" cy="68" rx="2.5" ry="4" fill="#64748b" opacity="0.6"/>

